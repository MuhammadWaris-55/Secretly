name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Obviously fake values so the build can pass env validation.
      # Real secrets never go in this file.
      HMAC_KEY: ci-only-fake-hmac-key-not-a-secret-000000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      GITHUB_CLIENT_ID: ci-fake-client-id
      GITHUB_CLIENT_SECRET: ci-fake-client-secret
      BETTER_AUTH_SECRET: ci-only-fake-auth-secret-not-a-secret-000000
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci-fake-client-id
      GITHUB_CLIENT_SECRET: ci-fake-client-secret
      BETTER_AUTH_SECRET: ci-only-fake-auth-secret-not-a-secret-000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep "${ARCHIVE}" checksums.txt | sha256sum --check
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run build
