name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: secretly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretly-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d secretly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Obviously fake values so the build can pass env validation.
      # Real secrets never go in this file.
      HMAC_KEY: ci-only-fake-hmac-key-not-a-secret-000000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      GITHUB_CLIENT_ID: ci-fake-client-id
      GITHUB_CLIENT_SECRET: ci-fake-client-secret
      BETTER_AUTH_SECRET: ci-only-fake-auth-secret-not-a-secret-000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep "${ARCHIVE}" checksums.txt | sha256sum --check
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:secretly-test-only@127.0.0.1:55432/secretly_test
      - run: npm run format:check
      - name: Build production images
        run: |
          docker build -f Dockerfile.web -t secretly-web:ci .
          docker build -f Dockerfile.worker -t secretly-worker:ci .

      - name: Smoke test production services
        env:
          DATABASE_URL: postgresql://postgres:secretly-test-only@127.0.0.1:55432/secretly_test
          DIRECT_URL: postgresql://postgres:secretly-test-only@127.0.0.1:55432/secretly_test
        run: |
          trap 'docker stop ci-web ci-worker >/dev/null 2>&1 || true' EXIT
          docker run --name ci-worker --rm -d --network host --read-only --tmpfs /tmp:size=768m \
            --cap-drop ALL --security-opt no-new-privileges -e DATABASE_URL -e DIRECT_URL -e HMAC_KEY secretly-worker:ci
          docker run --name ci-web --rm -d --network host -e DATABASE_URL -e DIRECT_URL -e HMAC_KEY \
            -e GITHUB_CLIENT_ID -e GITHUB_CLIENT_SECRET -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL secretly-web:ci
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3001/healthz
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3000/ -o /dev/null
          curl -fsS http://127.0.0.1:3000/api/auth/get-session | jq -e '. == null'
